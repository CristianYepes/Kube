[project]
name = "kube-agent"
version = "0.1.0"
description = "Plays the cub3D zombie mode: Jev (TypeSafe AI) picks the tactic, code does the rest"
requires-python = ">=3.12"
dependencies = [
    "typesafe-sdk==0.7.2",
]

[project.scripts]
kube-agent = "kube_agent.cli:main"

[build-system]
requires = ["uv_build>=0.8.24,<0.9.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1,<10",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
